services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: portal-vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "http://localhost:8222"
      SIGNUPS_ALLOWED: "${VW_SIGNUPS_ALLOWED:-false}" # Temporarily set true only during local account provisioning.
      WEBSOCKET_ENABLED: "true"
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - "./.vaultwarden-data:/data"
    security_opt:
      - no-new-privileges:true
